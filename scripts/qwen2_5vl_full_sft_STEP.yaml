### model
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
image_max_pixels: 313600
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: false
freeze_multi_modal_projector: false
freeze_language_model: false
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
# STEP-CoT mixed dataset: navigation main task + task breakdown + primitive skills
# (pose estimation, relative orientation, semantic inquiry, topological reasoning).
# Put the full corpus at `../data/step_cot_train.json`, or update the portable
# registry at `../data/dataset_info.json`.
dataset_dir: ../data
media_dir: ../data
dataset: step_cot_train
template: qwen2_vl
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 128
dataloader_num_workers: 8

### output
output_dir: saves/STEP/qwen2_5vl-7b/full/STEP_sft_qwen2_5vl_bs128_crop_560
logging_steps: 20
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 16
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
gradient_checkpointing: true

### eval
